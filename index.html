<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HP ScanJet Product</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile overlay -->
  <div id="overlay" onclick="closeSidebar()"></div>

  <!-- Mobile top bar -->
  <div class="mobile-bar">
    <div class="mobile-bar-logo">
      <i class="ti ti-scan"></i>
      HP ScanJet Product
    </div>
    <button class="mobile-menu-btn" onclick="openSidebar()">
      <i class="ti ti-menu-2"></i>
    </button>
  </div>

  <div class="layout">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <i class="ti ti-scan"></i>
          HP ScanJet Solution
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="why-scanner" href="#">
          <i class="ti ti-help-circle"></i>
          <span>Why Scanner?</span>
          <small>1</small>
        </a>
        <a class="nav-item" data-page="why-hp" href="#">
          <i class="ti ti-award"></i>
          <span>HP ScanJet Solution</span>
          <small>2</small>
        </a>
        <a class="nav-item" data-page="choose" href="#">
          <i class="ti ti-adjustments-horizontal"></i>
          <span>Choose the Right Scanner</span>
          <small>3</small>
        </a>
        <a class="nav-item" data-page="products" href="#">
          <i class="ti ti-layout-list"></i>
          <span>Product Lineups</span>
          <small>4</small>
        </a>
        <a class="nav-item" data-page="software" href="#">
          <i class="ti ti-apps"></i>
          <span>Software & Solutions</span>
          <small>5</small>
        </a>
        <a class="nav-item" data-page="usecases" href="#">
          <i class="ti ti-briefcase"></i>
          <span>Use Cases</span>
          <small>6</small>
        </a>
        <a class="nav-item" data-page="faq" href="#">
          <i class="ti ti-message-question"></i>
          <span>FAQ</span>
          <small>7</small>
        </a>
      </nav>

      <div class="sidebar-footer">HP ScanJet Portal</div>
    </aside>

    <!-- Main content -->
    <main id="main">
      <div id="content-area">
        <!-- loaded by app.js -->
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
